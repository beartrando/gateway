name: Push to base

run-name: Push to base

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into uat
        run: |
          git fetch origin

          git checkout dev
          git pull origin dev
          git push git@github.com:beartrando/auth.git dev
